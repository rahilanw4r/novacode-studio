name: Build NovaCode Studio APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Release Custom APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK and NDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$SDK_ROOT/platform-tools" >> $GITHUB_PATH
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.1.10909125" "cmake;3.22.1" || true

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Online Debug APK
        run: ./gradlew :app:assembleOnlineDebug -x lint --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaCode-Studio-Debug-APK
          path: app/build/outputs/apk/online/debug/*.apk

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_FILE=$(ls app/build/outputs/apk/online/debug/*.apk | head -n 1)
          cp "$APK_FILE" NovaCode-Studio-v1.0.14.apk
          gh release create v1.0.14 NovaCode-Studio-v1.0.14.apk --title "NovaCode Studio v1.0.14 — Android Zip Asset Checksum Fix" --notes "NovaCode Studio v1.0.14 fixes runtime setup checksum mismatches by updating ANDROID_SDK_SHA256 and ANDROID_MAVEN_SHA256 constants to match actual remote assets (e57ccbe19849a7462072a828db91c86abb00418a76e647bdb8a763b42fc5933e and 2273633fccc45215839ade08972831229330f1e22bc0d46303d0141263c41c6d)." || gh release upload v1.0.14 NovaCode-Studio-v1.0.14.apk --clobber

