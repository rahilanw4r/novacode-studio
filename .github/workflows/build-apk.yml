name: Build Pocket IDE APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    name: Build & Release Custom APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK and NDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$SDK_ROOT/platform-tools" >> $GITHUB_PATH
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.1.10909125" "cmake;3.22.1" || true

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Online Debug APK
        run: ./gradlew :app:assembleOnlineDebug -x lint --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pocket-IDE-Debug-APK
          path: app/build/outputs/apk/online/debug/*.apk

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_FILE=$(ls app/build/outputs/apk/online/debug/*.apk | head -n 1)
          VERSION_NAME=$(grep 'versionName =' app/build.gradle.kts | head -n 1 | awk -F'"' '{print $2}')
          TAG="v${VERSION_NAME:-1.0.17}"
          APK_NAME="Pocket-IDE-${TAG}.apk"
          echo "Publishing release $TAG with $APK_NAME from $APK_FILE"
          cp "$APK_FILE" "$APK_NAME"

          cat << 'EOF' > release_notes.md
          ### Pocket IDE v1.0.22

          **Your on-device AI-powered development workspace.**

          #### What's New:
          - **Developer-Focused Minimal UI Redesign**: Transitioned to a clean, dark neutral developer palette (slate/charcoal) with crisp typography and subtle borders.
          - **Restrained Semantic Colors**: Strictly restricted colors by role — Blue exclusively for primary actions/selection, Green exclusively for running/success states, and Red for errors/destructive actions.
          - **Streamlined AI Workspace**: Conversation is front and center; completed reasoning/thinking auto-collapses into a compact status row; tool executions are formatted as compact, expandable single-line items.
          - **Clean Project Workspace Dock**: Fast, unobtrusive switching between Agent, Files, Terminal, and Preview with understated active indicators.
          - **Minimalist Terminal & Preview**: Clean monospace terminal session tabs and developer preview toolbar without decorative gradients or colorful distractions.
          EOF

          gh release create "$TAG" "$APK_NAME" \
            --title "Pocket IDE $TAG — Your AI-powered development workspace, anywhere" \
            --notes-file release_notes.md || (
            gh release edit "$TAG" --title "Pocket IDE $TAG — Your AI-powered development workspace, anywhere" --notes-file release_notes.md && \
            gh release upload "$TAG" "$APK_NAME" --clobber
          )
