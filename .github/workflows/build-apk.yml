name: Build Pocket IDE APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    name: Build & Release Custom APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK and NDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$SDK_ROOT/platform-tools" >> $GITHUB_PATH
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.1.10909125" "cmake;3.22.1" || true

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Online Debug APK
        run: ./gradlew :app:assembleOnlineDebug -x lint --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pocket-IDE-Debug-APK
          path: app/build/outputs/apk/online/debug/*.apk

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_FILE=$(ls app/build/outputs/apk/online/debug/*.apk | head -n 1)
          VERSION_NAME=$(grep 'versionName =' app/build.gradle.kts | head -n 1 | awk -F'"' '{print $2}')
          VERSION_CODE=$(grep 'versionCode =' app/build.gradle.kts | head -n 1 | awk '{print $NF}' | tr -d '\r\n')
          TAG="v${VERSION_NAME:-1.0.24}"
          APK_NAME="Pocket-IDE-${TAG}.apk"
          echo "Publishing release $TAG with $APK_NAME from $APK_FILE"
          cp "$APK_FILE" "$APK_NAME"

          SHA256=$(sha256sum "$APK_NAME" | awk '{print $1}')
          SIZE_BYTES=$(stat -c%s "$APK_NAME" 2>/dev/null || stat -f%z "$APK_NAME")
          APK_DOWNLOAD_URL="https://github.com/rahilanw4r/pocket-ide/releases/download/${TAG}/${APK_NAME}"

          cat << EOF > pocket-ide-update.json
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "notes": "Pocket IDE ${TAG} — Clean minimal developer UI, fixed duplicate cards and ghost messages, auto-updates.",
            "artifacts": {
              "online": {
                "url": "${APK_DOWNLOAD_URL}",
                "sha256": "${SHA256}",
                "sizeBytes": ${SIZE_BYTES}
              }
            },
            "url": "${APK_DOWNLOAD_URL}",
            "sha256": "${SHA256}",
            "sizeBytes": ${SIZE_BYTES}
          }
          EOF

          cat << 'EOF' > release_notes.md
          ### Pocket IDE v1.0.26
          <!-- versionCode: 27 -->

          **Minimal, fast, and ChatGPT-styled mobile IDE workspace.**

          #### What's New:
          - **Clean Minimal Home Screen**: Removed clutter, cards, and duplicate actions. Kept only New Project, Open Project, and Recent Projects.
          - **ChatGPT Aesthetic**: Applied authentic ChatGPT dark theme (`#212121`, `#171717`, `#2F2F2F`, `#383838`) with OpenAI green accents across the whole app.
          - **ChatGPT Style Chatbot**: Floating capsule input bar with circular action buttons, right-aligned sleek rounded user message bubbles, and full-width markdown responses.
          - **Fast & Smooth Performance**: Optimized layouts and eliminated redundant shadow and draw overhead.
          EOF

          gh release create "$TAG" "$APK_NAME" pocket-ide-update.json \
            --title "Pocket IDE $TAG — Your AI-powered development workspace, anywhere" \
            --notes-file release_notes.md || (
            gh release edit "$TAG" --title "Pocket IDE $TAG — Your AI-powered development workspace, anywhere" --notes-file release_notes.md && \
            gh release upload "$TAG" "$APK_NAME" pocket-ide-update.json --clobber
          )
