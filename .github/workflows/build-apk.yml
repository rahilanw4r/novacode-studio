name: Build Pocket IDE APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    name: Build & Release Custom APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK and NDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$SDK_ROOT/platform-tools" >> $GITHUB_PATH
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.1.10909125" "cmake;3.22.1" || true

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Online Debug APK
        run: ./gradlew :app:assembleOnlineDebug -x lint --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pocket-IDE-Debug-APK
          path: app/build/outputs/apk/online/debug/*.apk

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_FILE=$(ls app/build/outputs/apk/online/debug/*.apk | head -n 1)
          VERSION_NAME=$(grep 'versionName =' app/build.gradle.kts | head -n 1 | awk -F'"' '{print $2}')
          TAG="v${VERSION_NAME:-1.0.17}"
          APK_NAME="Pocket-IDE-${TAG}.apk"
          echo "Publishing release $TAG with $APK_NAME from $APK_FILE"
          cp "$APK_FILE" "$APK_NAME"

          cat << 'EOF' > release_notes.md
          ### Pocket IDE v1.0.20

          **Your on-device AI-powered development workspace.**

          #### What's New:
          - **Compact Collapsible Execution Timeline**: Replaced heavy card-per-tool execution blocks with a sleek, space-efficient timeline (`✓ Read 4 files`, `✓ Created 3 files`, `✓ Started server`) expandable on tap to inspect raw outputs in monospace.
          - **Minimal Live Thinking**: Replaced massive reasoning blocks with a compact `✦ Thinking…` indicator that automatically collapses to `✓ Planned approach` upon completion.
          - **Subtle Status Indicators**: Removed giant repeated green "DONE" buttons across tool rows in favor of refined monospace status markers.
          - **Auto-Serving Static HTML Projects**: Embedded private loopback HTTP server automatically serves HTML/CSS/JS projects with zero setup, eliminating `ERR_CONNECTION_REFUSED`.
          - **Dev Server Port Auto-Detection**: Dynamic port resolution for Vite, Next.js, Python, and Node web apps from live terminal and agent execution streams.
          - **Developer-First Preview Error Screen**: Informative offline recovery UI with stack detection badge, 1-tap `[Start Dev Server]`, `[View Logs]`, and quick port switchers instead of raw browser errors.
          - **Direct Workspace Navigation**: 1-tap `[Open Preview]` and `[View Files]` action buttons right from the Agent completion summary.
          EOF

          gh release create "$TAG" "$APK_NAME" \
            --title "Pocket IDE $TAG — Your AI-powered development workspace, anywhere" \
            --notes-file release_notes.md || (
            gh release edit "$TAG" --title "Pocket IDE $TAG — Your AI-powered development workspace, anywhere" --notes-file release_notes.md && \
            gh release upload "$TAG" "$APK_NAME" --clobber
          )
